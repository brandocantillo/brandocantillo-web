<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<meta name="author" content="{{cfg.name}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="{{canonical}}">
<link rel="alternate" hreflang="es-CO" href="{{canonical}}">
<link rel="alternate" hreflang="x-default" href="{{canonical}}">
<link rel="alternate" type="application/rss+xml" title="Columnas de {{cfg.name}}" href="/feed.xml">
<meta property="og:type" content="{{kind}}">
<meta property="og:locale" content="es_CO">
<meta property="og:site_name" content="{{cfg.name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Brando Cantillo, estratega en comunicación y marketing político">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{desc}}">
<meta name="twitter:image" content="{{image}}">
<meta name="theme-color" content="#F3F4F6">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/avatar-512.jpg">
<link rel="manifest" href="/manifest.webmanifest">
{{verification}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
{{extra}}
<script type="application/ld+json">{{jsonld}}</script>
{{ga}}
</head>
